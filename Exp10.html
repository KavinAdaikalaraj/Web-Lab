<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serenity Yoga Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Serenity Yoga Studio</h1>
        <p>Find Your Balance. Breathe. Relax. Transform.</p>
    </header>

    <main>
        <section class="intro">
            <h2>Welcome to Our Yoga Studio</h2>
            <p>Join our yoga classes to improve your flexibility, fitness and peace of mind.</p>
        </section>

        <section class="form-container">
            <h2>Yoga Class Registration</h2>

            <form action="/server" method="POST">
                <label>Full Name:</label>
                <input type="text" name="name" placeholder="Enter your full name" required>

                <label>Email:</label>
                <input type="email" name="email" placeholder="Enter your email" required>

                <label>Phone Number:</label>
                <input type="tel" name="phone" pattern="[0-9]{10}"
                       placeholder="Enter 10-digit phone number" required>

                <label>Age:</label>
                <input type="number" name="age" min="10" max="100"
                       placeholder="Enter your age" required>

                <label>Gender:</label>
                <select name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>

                <label>City / Location:</label>
                <input type="text" name="location" placeholder="Enter your location" required>

                <label>Yoga Class:</label>
                <select name="classType" required>
                    <option value="">Select Yoga Class</option>
                    <option value="Hatha Yoga">Hatha Yoga</option>
                    <option value="Vinyasa Yoga">Vinyasa Yoga</option>
                    <option value="Power Yoga">Power Yoga</option>
                    <option value="Meditation">Meditation</option>
                </select>

                <label>Preferred Time:</label>
                <select name="preferredTime" required>
                    <option value="">Select Preferred Time</option>
                    <option value="Morning">Morning</option>
                    <option value="Afternoon">Afternoon</option>
                    <option value="Evening">Evening</option>
                </select>

                <label>Yoga Experience:</label>
                <select name="experience" required>
                    <option value="">Select Experience</option>
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Advanced">Advanced</option>
                </select>

                <button type="submit">Register Now</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Serenity Yoga Studio | Relax Your Mind, Strengthen Your Body</p>
    </footer>

</body>
</html>
